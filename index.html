    <!-- Meta Pixel Code — deferred until browser idle so it doesn't block first paint -->
    <script>
      (function () {

          if (window.fbq) return;
          !(function (f, b, e, v, n, t, s) {

            n.push = n;
            n.loaded = !0;
            n.version = "2.0";
            n.queue = [];
            t = b.createElement(e);
            t.async = !0;
            t.src = v;
            s = b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t, s);
          })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
          fbq("init", "827163549102837");

        } else {
          setTimeout(loadPixel, 2500);
        }
      })();
    </script>
